  # (captures/remoteB_speed{4,6}_recapture_raw.txt) resolved this: press 3 in
  # the original sequence never actually advanced the fan (a dropped/bounced
  # press on the physical remote, or the fan ignored a duplicate command) —
  # so the whole sequence after it was shifted by one step. The corrected
  # level -> button_id table, cross-checked against the direct re-captures:
  #   Level 1: 0x68 (captures/remoteB_speed1_raw.txt)
  #   Level 2: 0x69 (original sequence, press 1, unambiguous)
  #   Level 3: 0x6E (original sequence, press 2, unambiguous)
  #   Level 4: 0x65 (confirmed by direct re-capture; the original sequence's
  #             press 4 also decoded to this, once you account for the shift)
  #   Level 5: 0x67 (the original sequence's press 5 decoded to this; not
  #             independently re-captured, but it's the only slot left and is
  #             consistent with the shift)
  #   Level 6: 0x66 (confirmed by direct re-capture; matches the original
  #             session's earlier "already at max" capture from
