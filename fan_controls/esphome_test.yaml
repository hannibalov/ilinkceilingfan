  # (level unknown)" capture AND the earlier-captured "R" (reverse) button
  # (see send_b_r above). The same pattern shows up on Remote A (R's
  # button_id 0x08 == Speed Level 1's 0x08). Seeing it on BOTH remotes
  # independently makes this look like a real, systematic collision rather
  # than a decode fluke — i.e. R and Speed 1 may genuinely share a code on
  # this fan family. If pressing "Fan B Reverse" actually sets the fan to
  # speed 1 instead of reversing it, that confirms it — still unconfirmed
  # against the real fan.
