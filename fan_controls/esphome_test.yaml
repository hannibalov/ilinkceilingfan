# Transmitter firmware for the ESP32 with the CC1101 433 MHz transceiver.
# See README.md "CC1101 Migration Plan" for wiring (SPI + GDO0/GDO2).
#
# Usage:
#   python3 -m esphome run esphome_test.yaml --device /dev/cu.YOUR_ESP_PORT
#
# Codes below are the denoised captures from captures/parsed_results.md. Do NOT
# hand-edit these arrays; regenerate them with tools/parse_capture.py from a
# fresh capture if you need to re-verify one.
#
# Confidence varies by button — see captures/parsed_results.md and
# captures/README.md for the full picture:
#   - Remote A Fan Off + Speed 1-6: cross-validated via both up- and
#     down-transitions (2026-08-05). High confidence.
#   - Remote B Speed 1-6: resolved 2026-08-18 (levels 1/4/6 confirmed by
#     direct single-button re-capture, 2/3/5 single-sample). High-ish
#     confidence — see the note above send_b_speed1 for how an apparent
#     collision turned out to be a dropped-press shift, not a real conflict.
#   - Remote A F/R/≈ and Remote B Fan Off/F/R/≈: single-sample captures
#     (2026-08-18). Provisional — see the CAUTION comment near the button:
#     section below.
#
# CONFIRMED (2026-08-05): each speed button sends a code for the ABSOLUTE
# target speed level, not a generic "step" — verified by capturing every
# up AND down transition (1->2->3->4->5->6 and back) and finding the
# button_id for a given target level is identical regardless of direction.
# There is therefore no separate "tap"/"hold" distinction to model — one
# button per level, that's it. See captures/parsed_results.md "COMPLETE —
# Remote A speed level table" for the full evidence.
#
# For a standalone bench test that exercises Fan Off / Speed Down / Speed Up
# without Home Assistant, use esphome_test_loop.yaml instead (still uses the
# older tap-style codes — fine for a bench smoke test, but prefer the buttons
# below for actual use).

esphome:
  name: fan-control

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

wifi:
  ssid: "SercommDB48"
  password: "SFUGQZUBB9EYBZ"

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  # Do NOT add gdo0_pin here — known ESPHome bug (esphome/esphome#16876):
  # the cc1101 component's own pin_mode() call re-routes GDO0 back to plain
  # GPIO, severing the RMT peripheral's connection and silently producing no
  # RF. Let remote_transmitter's own `pin:` below own GDO0 exclusively.

remote_transmitter:
  - id: my_tx
    pin: GPIO4  # CC1101 GDO0
    carrier_duty_percent: 100%
    non_blocking: true
    on_transmit:
      then:
        - cc1101.begin_tx
    on_complete:
      then:
        - cc1101.begin_rx

# Optional loopback receiver, same CC1101 (GDO2) — useful for cross-validating
# a transmission actually went out before testing against the real fan.
remote_receiver:
  - id: my_rx
    pin:
      number: GPIO2  # CC1101 GDO2
      inverted: false
    dump: raw
    tolerance: 25%
    buffer_size: 10kb
    filter: 100us
    idle: 10ms

