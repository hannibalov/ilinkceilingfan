# ============================================================================
# NOTES
# ============================================================================
#
# Remote A:
#   Fan Off + Speed 1-6 were cross-validated via both up- and down-
#   transitions on 2026-08-05. High confidence.
#
# Remote B:
#   Speed 1-6 table resolved 2026-08-18.
#   Levels 4 and 6 were directly re-captured.
#   Levels 1/2/3/5 are based on the corrected sequence described in the
#   original capture notes.
#
# F / R / Breeze:
#   These are still single-sample captures from 2026-08-18.
#   They remain provisional.
#
# Important:
#   Remote A R and Remote B R share a button_id with Speed 1 on their
#   respective remotes. This appears systematic across the two remotes,
#   but has not been fully validated against the real fan.
#
# Summer / Winter:
#   Summer = Forward
#   Winter = Reverse
#
#   The physical fan handles stopping and reversing itself, including while
#   the fan is running. No software interlock is therefore required.
#
# TODO:
#   Power / Light / 1H / 4H / 8H for both remotes.
#
# ============================================================================