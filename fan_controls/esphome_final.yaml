# ============================================================================
# FAN SPEED SELECTORS
# ============================================================================

select:

  # --------------------------------------------------------------------------
  # BEDROOM FAN SPEED
  # --------------------------------------------------------------------------

  - platform: template
    name: "Bedroom Fan"
    id: bedroom_fan_speed
    icon: "mdi:fan"

    optimistic: true
    restore_value: false
    initial_option: "Off"

    options:
      - "Off"
      - "Speed 1"
      - "Speed 2"
      - "Speed 3"
      - "Speed 4"
      - "Speed 5"
      - "Speed 6"

    set_action:
      - lambda: |-
          if (x == "Off") {
            id(send_a_fanoff)->execute(6);
          } else if (x == "Speed 1") {
            id(send_a_speed1)->execute(6);
          } else if (x == "Speed 2") {
            id(send_a_speed2)->execute(6);
          } else if (x == "Speed 3") {
            id(send_a_speed3)->execute(6);
          } else if (x == "Speed 4") {
            id(send_a_speed4)->execute(6);
          } else if (x == "Speed 5") {
            id(send_a_speed5)->execute(6);
          } else if (x == "Speed 6") {
