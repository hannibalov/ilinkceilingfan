# Transmitter firmware for the ESP32 with the CC1101 433 MHz transceiver.
#
# Bedroom Fan + Living Room Fan
#
# Controls:
#   Fan Speed:
#     Off
#     Speed 1
#     Speed 2
#     Speed 3
#     Speed 4
#     Speed 5
#     Speed 6
#
#   Fan Mode:
#     Summer = Forward
#     Winter = Reverse
#
#   Breeze:
#     Separate button
#
# ESPHome version: 2026.7.4


esphome:
  name: fan-control


esp32:
  board: esp32dev
  framework:
    type: esp-idf


logger:


api:


wifi:
  ssid: "SercommDB48"
  password: "SFUGQZUBB9EYBZ"


# ============================================================================
# CC1101 / SPI
# ============================================================================

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19


cc1101:
  cs_pin: GPIO5
  frequency: 433.92MHz
  modulation_type: ASK/OOK

  # Do NOT add gdo0_pin here.
  #
  # The remote_transmitter pin below owns GDO0 exclusively.


remote_transmitter:
  - id: my_tx
    pin: GPIO4
    carrier_duty_percent: 100%
    non_blocking: true

    on_transmit:
      then:
        - cc1101.begin_tx

    on_complete:
      then:
        - cc1101.begin_rx


# Optional loopback receiver, same CC1101 (GDO2).
# Useful for cross-validating that a transmission actually went out.

remote_receiver:
  - id: my_rx
    pin:
      number: GPIO2
      inverted: false
    dump: raw
    tolerance: 25%
    buffer_size: 10kb
    filter: 100us
    idle: 10ms


